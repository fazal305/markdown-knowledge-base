<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Knowledge Base</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>

    <link rel="stylesheet" href="kb-styles.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <aside class="col-md-3 sidebar-panel">

                <div class="sidebar-header">
                    <h3 class="app-title">
                        Knowledge Base
                    </h3>

                    <button id="new-note-btn" class="btn btn-info w-100">
                        + New Note
                    </button>
                </div>

                <div class="sidebar-search">
                    <input
                        type="text"
                        id="sidebar-search"
                        class="form-control"
                        placeholder="Search notes...">
                </div>

                <div id="sidebar-notes">
                    <div class="note-placeholder">
                        Notes will appear here
                    </div>
                </div>

            </aside>

            <main class="col-md-9 content-panel">
                <div id="app-content"></div>
            </main>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="kb-router.js"></script>
    <script src="kb-renderer.js"></script>
    <script src="kb-storage.js"></script>
    <script src="kb-app.js"></script>

</body>
</html>
