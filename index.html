<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="A browser-based markdown knowledge base with notes, live preview, search, autosave, themes, and markdown export."
  />

  <title>Markdown Knowledge Base | Notes with Live Preview</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <link rel="canonical" href="https://fazal305.github.io/markdown-knowledge-base/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fazal305.github.io/markdown-knowledge-base/" />
  <meta property="og:title" content="Markdown Knowledge Base | Notes with Live Preview" />
  <meta property="og:description" content="A browser-based markdown knowledge base with notes, live preview, search, autosave, themes, and markdown export." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Markdown Knowledge Base | Notes with Live Preview" />
  <meta name="twitter:description" content="A browser-based markdown knowledge base with notes, live preview, search, autosave, themes, and markdown export." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>

  <link rel="stylesheet" href="kb-styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar-panel">
      <div class="sidebar-header">
        <h1 class="app-title">Knowledge Base</h1>
        <button id="new-note-btn" class="primary-btn" type="button">+ New Note</button>
      </div>

      <label class="sr-only" for="sidebar-search">Search notes</label>
      <input id="sidebar-search" class="sidebar-search" type="search" placeholder="Search notes..." />

      <nav id="sidebar-notes" class="sidebar-notes" aria-label="Saved notes">
        <div class="note-placeholder">Notes will appear here</div>
      </nav>
    </aside>

    <main class="content-panel">
      <div id="app-content"></div>
    </main>
  </div>

  <script src="kb-router.js"></script>
  <script src="kb-renderer.js"></script>
  <script src="kb-storage.js"></script>
  <script src="kb-app.js"></script>
</body>
</html>
